<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史尽调报告</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: #f0f2f5; color: #333; line-height: 1.8; }

  /* 顶部工具栏 */
  .toolbar { position: sticky; top: 0; z-index: 100; background: linear-gradient(135deg, #1a56db, #1e40af); color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .toolbar-left { display: flex; align-items: center; gap: 12px; }
  .toolbar-left .title { font-size: 16px; font-weight: 600; }
  .toolbar-left .subtitle { font-size: 12px; opacity: 0.85; }
  .toolbar-right { display: flex; gap: 8px; }
  .toolbar button { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; background: rgba(255,255,255,0.12); color: white; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .toolbar button:hover { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.5); }
  .toolbar button.btn-green { background: #059669; border-color: #059669; }
  .toolbar button.btn-green:hover { background: #047857; }

  .meta-bar { background: white; border-bottom: 1px solid #e5e7eb; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 20px; font-size: 13px; color: #6b7280; }
  .meta-bar .meta-item { display: flex; align-items: center; gap: 6px; }
  .meta-bar .meta-item .label { color: #9ca3af; }
  .meta-bar .meta-item .value { color: #374151; font-weight: 500; }

  .container { max-width: 900px; margin: 16px auto; padding: 0 16px; }

  /* 报告内容卡片 */
  .content-card { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; margin-bottom: 16px; }
  .content-card .header { padding: 16px 24px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; display: flex; align-items: center; justify-content: space-between; }
  .content-card .header h2 { font-size: 15px; font-weight: 600; color: #111827; display: flex; align-items: center; gap: 8px; }

  /* Markdown 内容样式 */
  #content { padding: 24px; }
  #content h1 { font-size: 22px; margin: 20px 0 12px; color: #111827; border-bottom: 2px solid #e5e7eb; padding-bottom: 8px; }
  #content h2 { font-size: 18px; margin: 18px 0 10px; color: #1f2937; border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; }
  #content h3 { font-size: 16px; margin: 16px 0 8px; color: #374151; }
  #content p { margin: 8px 0; }
  #content table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
  #content th, #content td { border: 1px solid #d1d5db; padding: 8px 12px; text-align: left; }
  #content th { background: #f3f4f6; font-weight: 600; color: #374151; }
  #content tr:nth-child(even) { background: #f9fafb; }
  #content blockquote { border-left: 4px solid #3b82f6; padding: 8px 16px; margin: 12px 0; background: #f0f7ff; color: #1e40af; border-radius: 0 8px 8px 0; }
  #content pre { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin: 12px 0; }
  #content code { font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; }
  #content ul, #content ol { padding-left: 24px; margin: 8px 0; }
  #content li { margin: 4px 0; }
  #content hr { border: none; border-top: 1px solid #e5e7eb; margin: 16px 0; }

  /* 附件卡片 */
  .attachments-card { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; margin-bottom: 16px; }
  .attachments-card .header { padding: 16px 24px; border-bottom: 1px solid #e5e7eb; background: #f9fafb; }
  .attachments-card .header h2 { font-size: 15px; font-weight: 600; color: #111827; display: flex; align-items: center; gap: 8px; }
  .att-list { padding: 12px 24px; }
  .att-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 8px; }
  .att-item .att-icon { font-size: 24px; }
  .att-item .att-info { flex: 1; }
  .att-item .att-name { font-size: 14px; font-weight: 500; color: #1f2937; }
  .att-item .att-dl { padding: 4px 12px; border-radius: 6px; border: 1px solid #3b82f6; background: white; color: #3b82f6; font-size: 12px; cursor: pointer; text-decoration: none; transition: all 0.2s; }
  .att-item .att-dl:hover { background: #eff6ff; }

  /* 加载 / 错误 */
  .loading { text-align: center; padding: 100px 20px; color: #9ca3af; }
  .spinner { width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { text-align: center; padding: 80px 20px; }
  .error .err-icon { font-size: 48px; margin-bottom: 12px; }
  .error .err-msg { font-size: 14px; color: #6b7280; }
  .error .retry-btn { margin-top: 16px; padding: 8px 24px; border-radius: 20px; border: none; background: #3b82f6; color: white; font-size: 13px; cursor: pointer; }

  /* PDF 模式 */
  body.pdf-mode { background: #fff; }
  body.pdf-mode .pdf-hidden { display: none !important; }
  #pdf-loading { display: none; text-align: center; padding: 60px 20px; color: #9ca3af; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.92); z-index: 9999; padding-top: 120px; }
  #pdf-loading .spinner { margin: 0 auto 16px; }
</style>
</head>
<body>
  <div id="app">
    <div class="loading"><div class="spinner"></div><p>正在加载报告...</p></div>
  </div>
  <div id="pdf-loading">
    <div class="spinner"></div>
    <p style="color:#8c8c8c;font-size:14px;">正在生成 PDF...</p>
  </div>

  <script>
  (function() {
    var params = new URLSearchParams(location.search);
    var reportId = params.get('report_id');
    var downloadPdf = params.get('download_pdf') === '1';
    var BASE = '/api/dd-reports';

    if (!reportId) {
      document.getElementById('app').innerHTML =
        '<div class="error"><div class="err-icon">❌</div><div class="err-msg">缺少 report_id 参数</div></div>';
      return;
    }

    loadReport(reportId);

    function loadReport(id) {
      fetch(BASE + '/' + encodeURIComponent(id))
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);
          return r.json();
        })
        .then(function(report) {
          var html = renderToolbar(report) + renderMeta(report) + '<div class="container">'
            + renderContent(report) + renderAttachments(report) + '</div>';
          document.getElementById('app').innerHTML = html;
          if (downloadPdf) {
            document.body.className = 'pdf-mode';
            generatePdf(report);
          }
        })
        .catch(function(e) {
          document.getElementById('app').innerHTML =
            '<div class="error"><div class="err-icon">⚠️</div><div class="err-msg">报告加载失败：' + e.message
            + '</div><button class="retry-btn" onclick="location.reload()">重新加载</button></div>';
        });
    }

    function renderToolbar(report) {
      return '<div class="toolbar">'
        + '<div class="toolbar-left">'
        + '<span class="title">📋 历史尽调报告</span>'
        + '<span class="subtitle">' + (report.company_name || '') + '</span>'
        + '</div>'
        + '<div class="toolbar-right pdf-hidden">'
        + '<button onclick="window.print()">🖨️ 打印</button>'
        + '<button class="btn-green" onclick="downloadPdfBtn()">⬇️ 下载 PDF</button>'
        + '<button onclick="window.close()">✕ 关闭</button>'
        + '</div>'
        + '</div>';
    }

    function renderMeta(report) {
      var time = report.generate_time || '';
      if (time) {
        time = time.replace('T', ' ').substring(0, 19);
      }
      return '<div class="meta-bar">'
        + '<div class="meta-item"><span class="label">报告编号</span><span class="value">' + (report.report_id || '-') + '</span></div>'
        + '<div class="meta-item"><span class="label">企业</span><span class="value">' + (report.company_name || '-') + '</span></div>'
        + '<div class="meta-item"><span class="label">模板</span><span class="value">' + (report.template_name || '-') + '</span></div>'
        + '<div class="meta-item"><span class="label">机构</span><span class="value">' + (report.institution || '-') + '</span></div>'
        + '<div class="meta-item"><span class="label">生成时间</span><span class="value">' + time + '</span></div>'
        + '</div>';
    }

    function renderContent(report) {
      var md = report.content || '';
      var html = '';
      try {
        html = marked.parse(md);
      } catch(e) {
        html = '<pre style="white-space:pre-wrap;">' + escapeHtml(md) + '</pre>';
      }
      return '<div class="content-card"><div class="header"><h2>📄 报告内容</h2></div>'
        + '<div id="content">' + html + '</div></div>';
    }

    function renderAttachments(report) {
      var atts = report.attachments || [];
      if (!Array.isArray(atts) || atts.length === 0) return '';
      var items = '';
      for (var i = 0; i < atts.length; i++) {
        var a = atts[i];
        var dlUrl = BASE + '/' + encodeURIComponent(report.report_id)
          + '/attachments/' + encodeURIComponent(a.file_id) + '/download';
        items += '<div class="att-item">'
          + '<span class="att-icon">📄</span>'
          + '<div class="att-info"><div class="att-name">' + escapeHtml(a.file_name || '未知文件') + '</div></div>'
          + '<a class="att-dl" href="' + dlUrl + '" download>⬇ 下载</a>'
          + '</div>';
      }
      return '<div class="attachments-card"><div class="header"><h2>📎 附件 (' + atts.length + ')</h2></div>'
        + '<div class="att-list">' + items + '</div></div>';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    /* ====== PDF 下载（html2canvas + jsPDF） ====== */
    function downloadPdfBtn() {
      document.getElementById('pdf-loading').style.display = 'block';
      loadCdnLibs().then(function() {
        var element = document.getElementById('content');
        if (!element) { document.getElementById('pdf-loading').style.display = 'none'; return; }
        var fileName = document.title || 'report';
        captureToPdf(element).then(function(pdf) {
          document.getElementById('pdf-loading').style.display = 'none';
          pdf.save(fileName + '.pdf');
        });
      });
    }

    function generatePdf(report) {
      document.getElementById('pdf-loading').style.display = 'block';
      loadCdnLibs().then(function() {
        var element = document.getElementById('content');
        if (!element) { document.getElementById('pdf-loading').style.display = 'none'; return; }
        var fileName = report.company_name || report.report_id || 'report';
        captureToPdf(element).then(function(pdf) {
          document.getElementById('pdf-loading').style.display = 'none';
          pdf.save(fileName + '.pdf');
          setTimeout(function() { window.close(); }, 500);
        });
      });
    }

    function loadCdnLibs() {
      return new Promise(function(resolve, reject) {
        if (window.jspdf && window.html2canvas) { resolve(); return; }
        var scripts = [
          'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
        ];
        var loaded = 0;
        scripts.forEach(function(src) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = function() { loaded++; if (loaded === scripts.length) setTimeout(resolve, 200); };
          s.onerror = reject;
          document.head.appendChild(s);
        });
      });
    }

    function captureToPdf(element) {
      return html2canvas(element, {
        scale: 2, useCORS: true,
        height: element.scrollHeight, width: element.clientWidth,
        windowHeight: element.scrollHeight, logging: false, backgroundColor: '#ffffff'
      }).then(function(canvas) {
        var pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        var pdfW = 210, pdfH = 297;
        var sliceH = canvas.width * pdfH / pdfW;
        var totalPx = canvas.height;
        var totalPages = Math.ceil(totalPx / sliceH);
        for (var i = 0; i < totalPages; i++) {
          if (i > 0) pdf.addPage();
          var sy = i * sliceH;
          var sh = Math.min(sliceH, totalPx - sy);
          var pageCanvas = document.createElement('canvas');
          pageCanvas.width = canvas.width;
          pageCanvas.height = sh;
          var ctx = pageCanvas.getContext('2d');
          ctx.drawImage(canvas, 0, sy, canvas.width, sh, 0, 0, canvas.width, sh);
          var imgH = sh < sliceH ? pdfW * sh / canvas.width : pdfH;
          pdf.addImage(pageCanvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pdfW, imgH);
        }
        return pdf;
      });
    }

    /* ====== 全局暴露函数供 onclick 使用 ====== */
    window.downloadPdfBtn = downloadPdfBtn;
    window.downloadPdfBtn_ = downloadPdfBtn;
  })();
  </script>
</body>
</html>
